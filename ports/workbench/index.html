<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Browser workbench</title>
<style>body{font:16px system-ui;max-width:70rem;margin:2rem auto;padding:0 1rem}main{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr))}section{border:1px solid #bbb;border-radius:.4rem;padding:1rem}label{display:block;margin:.6rem 0}input,select,button{font:inherit;padding:.3rem}pre{white-space:pre-wrap;overflow:auto;background:#f5f5f5;padding:.7rem}.error{color:#9b1c1c}.ok{color:#146c2e}</style></head>
<body><h1>QFA browser workbench</h1><p>Native WebAssembly model. Two-phase initial scope.</p>
<main><section><h2>Architecture and parameters</h2><label>Architecture <select id="architecture"><option value="qfa-graph">Graph-based QFA</option></select></label><label>Capacitors <input id="capacitors" type="number" min="2" max="3" value="2"></label><label>Duty <select id="duty"><option value="0.5">0.5</option><option value="0.25">0.25</option></select></label><label>Stages <input id="stages" type="number" min="1" value="2"></label><label>Phases <input id="phases" type="number" min="1" value="2"></label><button id="run">Run native model</button></section>
<section><h2>Result</h2><div id="result" aria-live="polite">Choose fixture and render.</div></section><section><h2>Structured errors</h2><div id="errors" class="error" aria-live="assertive">None</div></section></main>
<script>
const result = document.querySelector('#result'), errors = document.querySelector('#errors');
const worker = new Worker('worker.js');
worker.onmessage = ({data}) => { if (data.type === 'error') { errors.textContent = JSON.stringify(data.error, null, 2); result.className = ''; result.textContent = 'No result'; return; } errors.textContent = 'None'; result.className = 'ok'; result.innerHTML = `<strong>Native result v${data.version}</strong><pre>${JSON.stringify(data, null, 2)}</pre>`; };
document.querySelector('#run').onclick = () => { result.textContent = 'Computing…'; errors.textContent = 'None'; worker.postMessage({ version: 1, architecture: 'qfa-graph', stages: Number(document.querySelector('#stages').value), phases: Number(document.querySelector('#phases').value), capacitors: Number(document.querySelector('#capacitors').value), duty: Number(document.querySelector('#duty').value) }); };
</script></body></html>
